<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline Video SOP Inference</title>
<style>
:root{--bg:#071019;--p:#0c1924;--p2:#101f2c;--line:#21384a;--line2:#31556f;--cyan:#24cfff;--green:#2ee58b;--red:#ff4d6d;--yellow:#ffc857;--text:#e9f5ff;--muted:#7590a4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",sans-serif}header{min-height:58px;display:flex;align-items:center;padding:8px 18px;border-bottom:1px solid var(--line);background:var(--p);gap:14px;flex-wrap:wrap}.brand{font:700 13px ui-monospace;letter-spacing:2px;color:var(--cyan)}a,button{color:inherit}.nav{text-decoration:none;color:var(--muted)}.first{margin-left:auto}main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(390px,.9fr);height:calc(100vh - 58px)}.left{display:flex;flex-direction:column;min-width:0}.bar{display:flex;gap:10px;align-items:center;padding:12px;border-bottom:1px solid var(--line);background:var(--p2);flex-wrap:wrap}select,input,.btn{background:#07131d;border:1px solid var(--line);color:var(--text);border-radius:7px;padding:8px 10px}.btn{cursor:pointer;font-weight:700}.btn.primary{background:#0e5870;border-color:var(--cyan)}.viewer{flex:1;display:flex;align-items:center;justify-content:center;background:#02070b;position:relative;overflow:hidden}.viewer img{max-width:100%;max-height:100%;object-fit:contain}.empty{color:var(--muted);padding:18px;text-align:center}.progress{height:7px;background:#142532}.progress>div{height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));width:0;transition:width .2s}.right{border-left:1px solid var(--line);background:var(--p);display:grid;grid-template-rows:auto auto 1fr;overflow:hidden}.summary{padding:14px 16px;border-bottom:1px solid var(--line)}.summary-top{display:flex;align-items:flex-start;gap:12px}.verdict{font:800 26px ui-monospace;color:var(--yellow)}.summary-kpis{margin-left:auto;display:flex;gap:8px}.mini{min-width:74px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--p2);text-align:right}.mini span{display:block;color:var(--muted);font-size:9px;letter-spacing:1px}.mini b{font:700 15px ui-monospace}.meta{color:var(--muted);font:11px ui-monospace;margin-top:8px}.current-line{margin-top:9px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#07131d;font-size:12px}.current-line b{color:var(--yellow)}.alarm{display:none;padding:11px 16px;background:rgba(255,77,109,.16);border-bottom:1px solid var(--red);color:#ffdbe2;font-weight:700}.alarm.on{display:block}.flow-head{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.flow-title{font:800 11px ui-monospace;letter-spacing:1.5px}.flow-legend{margin-left:auto;color:var(--muted);font-size:10px}.flow{overflow:auto;padding:14px 14px 22px}.flow-row{position:relative;padding-left:50px;min-height:75px}.flow-row:not(:last-child):before{content:"";position:absolute;left:20px;top:39px;bottom:-4px;width:3px;background:#284254;border-radius:3px}.flow-row.connector-done:not(:last-child):before{background:var(--green)}.flow-row.connector-active:not(:last-child):before{background:linear-gradient(var(--cyan),#284254)}.flow-row.connector-alarm:not(:last-child):before{background:var(--red)}.flow-node{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--p2);padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;transition:.18s}.flow-dot{position:absolute;left:-47px;top:10px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line2);background:#07131d;color:var(--muted);font:800 12px ui-monospace;z-index:2}.flow-node.current{border-color:var(--yellow);background:rgba(255,200,87,.08);box-shadow:0 0 0 1px rgba(255,200,87,.15)}.flow-node.current .flow-dot{border-color:var(--yellow);color:var(--yellow);animation:pulse 1s infinite}.flow-node.detecting{border-color:var(--cyan);background:rgba(36,207,255,.07)}.flow-node.detecting .flow-dot{border-color:var(--cyan);color:var(--cyan)}.flow-node.done{border-color:rgba(46,229,139,.5);background:rgba(46,229,139,.06)}.flow-node.done .flow-dot{background:var(--green);border-color:var(--green);color:#001a10}.flow-node.timeout,.flow-node.alarm-step{border-color:var(--red);background:rgba(255,77,109,.08)}.flow-node.timeout .flow-dot,.flow-node.alarm-step .flow-dot{border-color:var(--red);color:var(--red)}.flow-node.optional{border-style:dashed}.flow-name{font-weight:800;font-size:13px}.flow-sub{font:10px ui-monospace;color:var(--muted);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap}.flow-state{text-align:right;font:800 10px ui-monospace;letter-spacing:.7px;color:var(--muted)}.flow-node.done .flow-state{color:var(--green)}.flow-node.current .flow-state{color:var(--yellow)}.flow-node.detecting .flow-state{color:var(--cyan)}.flow-node.timeout .flow-state,.flow-node.alarm-step .flow-state{color:var(--red)}.required-tag{font-size:9px;color:var(--muted);font-weight:400}.hitbar{height:4px;background:#183041;border-radius:4px;overflow:hidden;margin-top:7px}.hitbar>i{display:block;height:100%;background:var(--cyan);width:0}.flow-node.done .hitbar>i{background:var(--green);width:100%!important}@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(255,200,87,0)}}
@media(max-width:960px){main{grid-template-columns:1fr;height:auto}.viewer{height:52vh}.right{min-height:54vh;border-left:0;border-top:1px solid var(--line)}.first{margin-left:0}}
</style>
</head>
<body>
<header><div class="brand">OFFLINE VIDEO / SOP INFERENCE</div><a class="nav first" href="./">⌂ Home</a><a class="nav" href="./video-label">Video Label</a><a class="nav" href="./multi-stream">Streams</a><button class="btn" id="soundBtn">🔇 啟用警報聲</button></header>
<main>
<section class="left"><div class="bar"><select id="product"><option>載入產品…</option></select><input id="file" type="file" accept="video/*"><label>推論 FPS <input id="fps" type="number" value="2" min="0.1" max="30" step="0.5" style="width:75px"></label><button class="btn primary" id="run">開始推論</button><button class="btn" id="stop">停止</button></div><div class="progress"><div id="prog"></div></div><div class="viewer"><div id="empty" class="empty">載入影片後開始 SOP 推論</div><img id="img" hidden alt="推論結果畫面"></div></section>
<aside class="right"><div id="alarm" class="alarm"></div><div class="summary"><div class="summary-top"><div><div id="verdict" class="verdict">WAITING</div><div id="meta" class="meta">尚未執行</div></div><div class="summary-kpis"><div class="mini"><span>FLOW</span><b id="flowCount">0 / 0</b></div><div class="mini"><span>PROGRESS</span><b id="flowPct">0%</b></div></div></div><div class="current-line">目前步驟：<b id="currentStep">等待開始</b></div></div><div class="flow-head"><span class="flow-title">LIVE FLOW MAP</span><span class="flow-legend">綠：完成｜黃：目前｜藍：辨識中｜紅：異常</span></div><div id="steps" class="flow"><div class="empty">尚未載入 Flow</div></div></aside>
</main>
<script>
let token='',eventSource=null,lastAlarm=0,audioCtx=null,soundEnabled=false;const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function statusLabel(s){return({PENDING:'待執行',DETECTING:'辨識中',DONE:'已完成',TIMEOUT:'逾時'}[String(s||'').toUpperCase()]||String(s||'PENDING'))}
function nodeClass(step,sop){const status=String(step.status||'PENDING').toUpperCase();const current=Number(step.id)===Number(sop.current_step_id);const alarmStep=Number(step.id)===Number(sop.alarm?.step_id)&&sop.alarm?.active;return [status.toLowerCase(),current?'current':'',alarmStep?'alarm-step':'',step.required?'':'optional'].filter(Boolean).join(' ')}
function connectorClass(step,sop){const status=String(step.status||'PENDING').toUpperCase();if(Number(step.id)===Number(sop.alarm?.step_id)&&sop.alarm?.active)return'connector-alarm';if(status==='DONE')return'connector-done';if(Number(step.id)===Number(sop.current_step_id)||status==='DETECTING')return'connector-active';return''}
function renderFlow(sop){if(!sop){$('alarm').classList.remove('on');$('alarm').textContent='';$('steps').innerHTML='<div class="empty">此產品未啟用 SOP，僅顯示單幀推論。</div>';$('flowCount').textContent='0 / 0';$('flowPct').textContent='0%';$('currentStep').textContent='未啟用 SOP';return}const alarm=sop.alarm||{};$('alarm').classList.toggle('on',!!alarm.active);$('alarm').textContent=alarm.active?'⚠ '+alarm.message:'';if(alarm.active&&Number(alarm.seq)>lastAlarm){lastAlarm=Number(alarm.seq);beep()}$('flowCount').textContent=`${sop.done_count||0} / ${sop.total_required||0}`;$('flowPct').textContent=`${Number(sop.progress_pct||0).toFixed(0)}%`;$('currentStep').textContent=sop.complete?'全部必要步驟完成':(sop.current_step_name||'等待第一個步驟');const steps=sop.steps||[];$('steps').innerHTML=steps.length?steps.map((x,i)=>{const status=String(x.status||'PENDING').toUpperCase();const info=[];if(x.matched_label)info.push(esc(x.matched_label));if(Number(x.last_score||0)>0)info.push(`score ${Number(x.last_score).toFixed(3)}`);if(Number(x.elapsed_sec||0)>0)info.push(`${Number(x.elapsed_sec).toFixed(1)}s`);const hitPct=Math.min(100,Math.max(0,Number(x.consecutive_hits||0)/Math.max(1,Number(x.min_consecutive_hits||1))*100));const holdPct=Number(x.hold_target_ms||0)>0?Math.min(100,Math.max(0,Number(x.hold_ms_acc||0)/Number(x.hold_target_ms)*100)):100;const evidencePct=Math.min(hitPct,holdPct);return `<div class="flow-row ${connectorClass(x,sop)}"><div class="flow-node ${nodeClass(x,sop)}"><div class="flow-dot">${status==='DONE'?'✓':esc(x.step_no)}</div><div><div class="flow-name">${esc(x.name)} ${x.required?'':'<span class="required-tag">(選填)</span>'}</div><div class="flow-sub">${info.length?info.map(v=>`<span>${v}</span>`).join(''):'<span>等待畫面特徵</span>'}</div><div class="hitbar"><i style="width:${status==='DETECTING'?evidencePct:status==='DONE'?100:0}%"></i></div></div><div class="flow-state">${Number(x.id)===Number(sop.current_step_id)&&status==='PENDING'?'CURRENT':statusLabel(status)}</div></div></div>`}).join(''):'<div class="empty">此產品尚未建立 SOP Flow</div>'}
async function init(){const r=await fetch('./api/products');const products=await r.json();$('product').innerHTML='<option value="">選擇產品 / SOP</option>'+products.map(p=>`<option value="${p.id}">${esc(p.serial)}${p.name?' / '+esc(p.name):''}</option>`).join('')}
async function upload(){const f=$('file').files[0];if(!f)throw Error('請選擇影片');const fd=new FormData();fd.append('file',f);const r=await fetch('./api/video/upload',{method:'POST',body:fd});const d=await r.json();if(!r.ok)throw Error(d.error||r.status);token=d.token;return d}
function enableSound(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();soundEnabled=true;$('soundBtn').textContent='🔊 警報聲已啟用'}catch(e){alert('瀏覽器無法啟用聲音')}}
async function cleanupToken(tokenToDelete=token,retry=0){const old=String(tokenToDelete||'');if(!old)return true;try{const r=await fetch('./api/video/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:old}),keepalive:true});if(r.ok){if(token===old)token='';return true}if(retry<3)setTimeout(()=>cleanupToken(old,retry+1),700*(retry+1));return false}catch(e){if(retry<3)setTimeout(()=>cleanupToken(old,retry+1),700*(retry+1));return false}}
function beep(){if(!soundEnabled)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();[0,.18,.36].forEach(delay=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=820;o.type='square';g.gain.setValueAtTime(.22,audioCtx.currentTime+delay);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+delay+.12);o.start(audioCtx.currentTime+delay);o.stop(audioCtx.currentTime+delay+.13)})}catch(e){}}
async function startRun(){try{if(eventSource)eventSource.close();await cleanupToken();lastAlarm=0;const pid=$('product').value;if(!pid)throw Error('請選擇產品');$('run').disabled=true;const video=await upload();$('meta').textContent=`${video.frames} frames · ${video.fps.toFixed(2)} fps`;const url=`./api/video/sop_stream_infer?token=${encodeURIComponent(token)}&product_id=${pid}&infer_fps=${encodeURIComponent($('fps').value||2)}`;eventSource=new EventSource(url);eventSource.onmessage=event=>{const d=JSON.parse(event.data);if(d.type==='frame'){$('empty').hidden=true;$('img').hidden=false;$('img').src=d.result_img;$('prog').style.width=(d.progress||0)+'%';$('verdict').textContent=d.verdict||'RUNNING';$('verdict').style.color=d.verdict==='COMPLETE'?'var(--green)':d.verdict==='ALARM'?'var(--red)':'var(--yellow)';$('meta').textContent=`${d.time.toFixed(2)} s · frame ${d.frame} · ${d.progress.toFixed(1)}%`;renderFlow(d.sop)}else if(d.type==='done'){renderFlow(d.sop);const verdict=d.verdict||(d.sop?(d.sop.complete?'COMPLETE':'INCOMPLETE'):(d.pass?'PASS':'FAIL'));$('verdict').textContent=verdict;$('verdict').style.color=(verdict==='COMPLETE'||verdict==='PASS')?'var(--green)':'var(--red)';$('prog').style.width='100%';eventSource.close();eventSource=null;const finishedToken=token;setTimeout(()=>cleanupToken(finishedToken),400);$('run').disabled=false}};eventSource.onerror=()=>{if(eventSource)eventSource.close();eventSource=null;const failedToken=token;setTimeout(()=>cleanupToken(failedToken),500);$('run').disabled=false;$('verdict').textContent='CONNECTION ERROR';$('verdict').style.color='var(--red)'}}catch(e){alert(e.message);$('run').disabled=false}}
$('run').addEventListener('click',startRun);$('soundBtn').addEventListener('click',enableSound);$('stop').addEventListener('click',()=>{if(eventSource)eventSource.close();eventSource=null;const stoppedToken=token;setTimeout(()=>cleanupToken(stoppedToken),400);$('run').disabled=false;$('verdict').textContent='STOPPED';$('verdict').style.color='var(--yellow)'});window.addEventListener('beforeunload',()=>{if(token)navigator.sendBeacon('./api/video/delete',new Blob([JSON.stringify({token})],{type:'application/json'}))});init();
</script>
</body>
</html>
