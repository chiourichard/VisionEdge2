<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multi-Stream SOP Center</title>
<style>
:root{--bg:#061018;--p:#0b1823;--p2:#10222f;--line:#1d3a4d;--line2:#31576e;--cyan:#24d0ff;--green:#32e88e;--red:#ff4b6b;--yellow:#ffca55;--text:#eaf7ff;--muted:#7390a5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",sans-serif}header{min-height:60px;background:var(--p);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:8px 18px;gap:12px;position:sticky;top:0;z-index:5;flex-wrap:wrap}.brand{font:700 13px ui-monospace;letter-spacing:2px;color:var(--cyan)}.btn,input,select{background:#07141e;border:1px solid var(--line);color:var(--text);border-radius:7px;padding:8px 10px}.btn{cursor:pointer;font-weight:700}.btn.primary{background:#0b5872;border-color:var(--cyan)}.spacer{flex:1}a{color:var(--muted);text-decoration:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(560px,1fr));gap:14px;padding:14px}.tile{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--p);box-shadow:0 10px 30px rgba(0,0,0,.24)}.tile.ALARM{border-color:var(--red);box-shadow:0 0 0 1px var(--red),0 0 28px rgba(255,75,107,.15)}.tile.COMPLETE{border-color:#237852}.th{min-height:47px;padding:7px 12px;display:flex;align-items:center;border-bottom:1px solid var(--line);background:var(--p2);gap:9px}.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}.LIVE .dot{background:var(--green);box-shadow:0 0 10px var(--green)}.RECONNECTING .dot,.CONNECTING .dot{background:var(--yellow)}.ERROR .dot,.ALARM .dot{background:var(--red)}.name{font-weight:800}.small{font:11px ui-monospace;color:var(--muted)}.verdict{margin-left:auto;font:800 12px ui-monospace;color:var(--yellow)}.body{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,.8fr);min-height:330px}.view{background:#020609;display:flex;align-items:center;justify-content:center;min-height:330px}.view img{width:100%;height:100%;max-height:460px;object-fit:contain}.side{border-left:1px solid var(--line);display:grid;grid-template-rows:auto auto 1fr;overflow:hidden;max-height:460px}.stream-meta{padding:9px 11px;border-bottom:1px solid var(--line)}.progress-line{display:flex;align-items:center;gap:8px;margin-top:7px}.progress-track{height:7px;flex:1;background:#142d3d;border-radius:8px;overflow:hidden}.progress-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));transition:width .2s}.current-label{margin-top:6px;font-size:11px}.current-label b{color:var(--yellow)}.alarm{margin:8px 10px 0;padding:8px;border:1px solid var(--red);background:rgba(255,75,107,.12);color:#ffdce3;font-size:12px}.flow{overflow:auto;padding:10px 10px 18px}.flow-row{position:relative;padding-left:38px;min-height:65px}.flow-row:not(:last-child):before{content:"";position:absolute;left:15px;top:32px;bottom:-3px;width:3px;background:#294656;border-radius:3px}.flow-row.connector-done:not(:last-child):before{background:var(--green)}.flow-row.connector-active:not(:last-child):before{background:linear-gradient(var(--cyan),#294656)}.flow-row.connector-alarm:not(:last-child):before{background:var(--red)}.flow-node{position:relative;border:1px solid var(--line);border-radius:8px;padding:8px 9px;background:#0a1721;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}.flow-dot{position:absolute;left:-36px;top:7px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line2);background:#061018;color:var(--muted);font:800 10px ui-monospace;z-index:2}.flow-name{font-size:11px;font-weight:800}.flow-sub{font:9px ui-monospace;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.flow-state{font:800 9px ui-monospace;color:var(--muted);text-align:right}.flow-node.current{border-color:var(--yellow);background:rgba(255,202,85,.07)}.flow-node.current .flow-dot{border-color:var(--yellow);color:var(--yellow);animation:pulse 1s infinite}.flow-node.detecting{border-color:var(--cyan)}.flow-node.detecting .flow-dot{border-color:var(--cyan);color:var(--cyan)}.flow-node.done{border-color:rgba(50,232,142,.45);background:rgba(50,232,142,.05)}.flow-node.done .flow-dot{background:var(--green);border-color:var(--green);color:#001b11}.flow-node.done .flow-state{color:var(--green)}.flow-node.timeout,.flow-node.alarm-step{border-color:var(--red);background:rgba(255,75,107,.06)}.flow-node.timeout .flow-dot,.flow-node.alarm-step .flow-dot{border-color:var(--red);color:var(--red)}.flow-node.timeout .flow-state,.flow-node.alarm-step .flow-state{color:var(--red)}.flow-node.optional{border-style:dashed}.actions{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line);flex-wrap:wrap}.actions .btn{font-size:10px;padding:5px 8px}dialog{background:var(--p);color:var(--text);border:1px solid var(--line);border-radius:12px;min-width:min(600px,94vw);padding:0}dialog::backdrop{background:rgba(0,0,0,.7)}.form{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:12px}.wide{grid-column:1/-1}.dlghead,.dlgfoot{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center}.dlgfoot{border-top:1px solid var(--line);border-bottom:0;justify-content:flex-end;gap:8px}@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,202,85,0)}}@media(max-width:850px){.grid{grid-template-columns:1fr;padding:8px}.body{grid-template-columns:1fr}.side{border-left:0;border-top:1px solid var(--line);max-height:none}.view{min-height:260px}.spacer{display:none}}
</style>
</head>
<body>
<header><div class="brand">MULTI-STREAM / SOP CENTER</div><button class="btn primary" id="addBtn">＋ 新增串流</button><button class="btn" id="reloadBtn">↻ 重載全部</button><button class="btn" id="soundBtn">🔇 啟用警報聲</button><div class="spacer"></div><a href="./">⌂ Home</a><a href="./offline-infer">Offline</a><a href="./sop-config">SOP</a></header>
<main id="grid" class="grid"></main>
<dialog id="dialog"><div class="dlghead"><b id="dialogTitle">新增串流</b></div><div class="form"><input id="streamId" type="hidden"><label>名稱<input id="name" placeholder="Line A / Camera 1"></label><label>類型<select id="sourceType"><option>RTSP</option><option>HTTP</option><option>USB</option><option>VIDEO</option></select></label><label class="wide">來源 URI<input id="sourceUri" placeholder="rtsp://user:pass@ip/stream 或 0 或 /data/video.mp4"></label><label>產品 / SOP<select id="product"></select></label><label>推論 FPS<input id="inferFps" type="number" min="0.1" max="30" step="0.5" value="2"></label><label>重連秒數<input id="reconnect" type="number" min="0.5" step="0.5" value="3"></label><label><span>啟用</span><input id="enabled" type="checkbox" checked></label><label><span>影片循環</span><input id="loopVideo" type="checkbox"></label></div><div class="dlgfoot"><button class="btn" id="cancelBtn">取消</button><button class="btn primary" id="saveBtn">儲存並啟動</button></div></dialog>
<script>
const $=id=>document.getElementById(id);let products=[],configs=[],lastAlarm={};let audioCtx=null,soundEnabled=false;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function enableSound(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();soundEnabled=true;$('soundBtn').textContent='🔊 警報聲已啟用'}catch(e){alert('瀏覽器無法啟用聲音')}}
function beep(){if(!soundEnabled)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type='square';o.frequency.value=900;g.gain.setValueAtTime(.25,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.28);o.start();o.stop(audioCtx.currentTime+.3)}catch(e){}}
function statusLabel(s){return({PENDING:'待執行',DETECTING:'辨識中',DONE:'已完成',TIMEOUT:'逾時'}[String(s||'').toUpperCase()]||String(s||'PENDING'))}
function nodeClass(step,sop){const status=String(step.status||'PENDING').toUpperCase();const current=Number(step.id)===Number(sop.current_step_id);const alarmStep=Number(step.id)===Number(sop.alarm?.step_id)&&sop.alarm?.active;return [status.toLowerCase(),current?'current':'',alarmStep?'alarm-step':'',step.required?'':'optional'].filter(Boolean).join(' ')}
function connectorClass(step,sop){const status=String(step.status||'PENDING').toUpperCase();if(Number(step.id)===Number(sop.alarm?.step_id)&&sop.alarm?.active)return'connector-alarm';if(status==='DONE')return'connector-done';if(Number(step.id)===Number(sop.current_step_id)||status==='DETECTING')return'connector-active';return''}
function renderFlow(sop){const steps=sop?.steps||[];if(!steps.length)return'<div class="small">未啟用 SOP 或等待資料</div>';return steps.map(x=>{const status=String(x.status||'PENDING').toUpperCase();const sub=[];if(x.matched_label)sub.push(esc(x.matched_label));if(Number(x.last_score||0)>0)sub.push(`score ${Number(x.last_score).toFixed(3)}`);if(String(x.status||'').toUpperCase()==='DETECTING')sub.push(`hit ${x.consecutive_hits||0}/${x.min_consecutive_hits||1}`);if(Number(x.ok_sample_count||0)>1)sub.push(`OK×${x.ok_sample_count}`);return `<div class="flow-row ${connectorClass(x,sop)}"><div class="flow-node ${nodeClass(x,sop)}"><div class="flow-dot">${status==='DONE'?'✓':esc(x.step_no)}</div><div><div class="flow-name">${esc(x.name)}${x.required?'':' · 選填'}</div><div class="flow-sub">${sub.length?sub.join(' · '):'等待畫面特徵'}</div></div><div class="flow-state">${Number(x.id)===Number(sop.current_step_id)&&status==='PENDING'?'CURRENT':statusLabel(status)}</div></div></div>`}).join('')}
function renderTile(x){const config=x.config||{},sop=x.sop||{},alarm=sop.alarm||{};const alarmKey=lastAlarm[x.stream_id]||{};const session=String(sop.session_id||'');if(alarm.active&&(alarmKey.session!==session||Number(alarm.seq)>Number(alarmKey.seq||0))){lastAlarm[x.stream_id]={session,seq:Number(alarm.seq||0)};beep()}const cls=alarm.active?'ALARM':sop.complete?'COMPLETE':(x.status||'');const current=sop.complete?'全部必要步驟完成':(sop.current_step_name||'等待開始');return `<section class="tile ${cls} ${x.status||''}"><div class="th"><span class="dot"></span><span class="name">${esc(config.name||x.name)}</span><span class="small">${esc(config.product_serial||'')}</span><span class="verdict">${esc(x.verdict||x.status||'WAIT')}</span></div><div class="body"><div class="view">${x.has_image?`<img src="./api/runtime/streams/${x.stream_id}/image?seq=${x.frame_seq||0}" alt="${esc(config.name||x.name)} 推論畫面">`:`<div class="small">${esc(x.error||x.status||'等待影像')}</div>`}</div><div class="side"><div class="stream-meta"><div class="small">${esc(config.source_type)} · ${esc(config.source_uri_masked||config.source_uri)}<br>${x.fps||0} infer fps · frame ${x.frame_seq||0}</div><div class="progress-line"><div class="progress-track"><div class="progress-fill" style="width:${Math.max(0,Math.min(100,Number(sop.progress_pct||0)))}%"></div></div><b class="small">${sop.done_count||0}/${sop.total_required||0}</b></div><div class="current-label">目前：<b>${esc(current)}</b></div></div>${alarm.active?`<div class="alarm">⚠ ${esc(alarm.message)}</div>`:''}<div class="flow">${renderFlow(sop)}</div></div></div><div class="actions"><button class="btn" data-action="reset" data-id="${x.stream_id}">Reset SOP</button><button class="btn" data-action="finish" data-id="${x.stream_id}">Finish Gate</button><button class="btn" data-action="ack" data-id="${x.stream_id}">Ack Alarm</button><button class="btn" data-action="edit" data-id="${x.stream_id}">Edit</button><button class="btn" data-action="delete" data-id="${x.stream_id}">Delete</button></div></section>`}
async function init(){products=await(await fetch('./api/products')).json();$('product').innerHTML=products.map(p=>`<option value="${p.id}">${esc(p.serial)}${p.name?' / '+esc(p.name):''}</option>`).join('');configs=await(await fetch('./api/stream-sources')).json();poll()}
async function poll(){try{const d=await(await fetch('./api/runtime/streams?include_images=0')).json();$('grid').innerHTML=(d.streams||[]).map(renderTile).join('')||'<div class="small">尚未設定串流來源。</div>'}catch(e){}setTimeout(poll,1000)}
function openDialog(config={}){$('streamId').value=config.id||'';$('name').value=config.name||'';$('sourceType').value=config.source_type||'RTSP';$('sourceUri').value=config.source_uri||'';$('product').value=config.product_id||products[0]?.id||'';$('inferFps').value=config.infer_fps||2;$('reconnect').value=config.reconnect_sec||3;$('enabled').checked=config.enabled!==0;$('loopVideo').checked=!!config.loop_video;$('dialogTitle').textContent=config.id?'編輯串流':'新增串流';$('dialog').showModal()}
function editSource(id){const config=configs.find(x=>Number(x.id)===Number(id));if(config)openDialog(config)}
async function saveSource(){const id=$('streamId').value;const body={name:$('name').value,source_type:$('sourceType').value,source_uri:$('sourceUri').value,product_id:Number($('product').value),infer_fps:Number($('inferFps').value),reconnect_sec:Number($('reconnect').value),enabled:$('enabled').checked,loop_video:$('loopVideo').checked};const r=await fetch(id?`./api/stream-sources/${id}`:'./api/stream-sources',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok){alert(d.error||r.status);return}$('dialog').close();configs=await(await fetch('./api/stream-sources')).json()}
async function deleteSource(id){if(!confirm('刪除此串流設定？'))return;await fetch(`./api/stream-sources/${id}`,{method:'DELETE'});configs=await(await fetch('./api/stream-sources')).json()}
async function reloadRuntime(){await fetch('./api/runtime/reload',{method:'POST'});configs=await(await fetch('./api/stream-sources')).json()}
async function resetSop(id){await fetch(`./api/runtime/streams/${id}/reset`,{method:'POST'})}
async function finishSop(id){await fetch(`./api/runtime/streams/${id}/finish`,{method:'POST'})}
async function ackSop(id){await fetch(`./api/runtime/streams/${id}/ack`,{method:'POST'})}
$('grid').addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const id=Number(b.dataset.id);({reset:resetSop,finish:finishSop,ack:ackSop,edit:editSource,delete:deleteSource}[b.dataset.action])?.(id)});$('addBtn').addEventListener('click',()=>openDialog());$('reloadBtn').addEventListener('click',reloadRuntime);$('soundBtn').addEventListener('click',enableSound);$('cancelBtn').addEventListener('click',()=>$('dialog').close());$('saveBtn').addEventListener('click',saveSource);init();
</script>
</body>
</html>
