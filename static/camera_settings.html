<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VisionEdge · 相機設定</title>
<link rel="stylesheet" href="/static/primary_nav.css?v=2.4.5">
<link rel="stylesheet" href="/static/notice.css?v=1">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#1d1d1f;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 24px;background:white}h1{font-size:22px;margin:0}main{max-width:1200px;margin:24px auto;padding:0 18px;display:grid;grid-template-columns:1fr 1fr;gap:20px}section{background:white;border:1px solid #dfe2e7;border-radius:18px;padding:22px;min-width:0}h2{font-size:18px;margin-top:0}button,select,input{font:inherit;border:1px solid #dfe2e7;border-radius:8px;padding:9px;background:#f5f5f7;color:inherit}button{cursor:pointer}button:disabled,input:disabled,select:disabled{opacity:.5;cursor:default}.primary{background:#0071e3;color:white;border-color:#0071e3}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.fields{display:grid;gap:16px}.fields label{display:grid;grid-template-columns:minmax(0,1fr) minmax(100px,150px);gap:5px;align-items:center}small{grid-column:1/-1;color:#69717d;line-height:1.5}p{line-height:1.65}img{width:100%;max-height:440px;object-fit:contain;background:#101827;border-radius:10px}[hidden]{display:none!important}#cameraState{padding:10px;border-radius:8px;background:#eef5ff;white-space:pre-wrap}details{margin:16px 0}summary{cursor:pointer}dialog{max-width:520px;border:1px solid #dfe2e7;border-radius:16px;padding:24px}dialog::backdrop{background:#0005}.unsupported{font-size:13px;color:#69717d}@media(max-width:800px){main{grid-template-columns:1fr}}
</style></head>
<body><header><h1>VisionEdge · 相機設定</h1><label><span>語言</span> <select data-i18n-language aria-label="Language" onchange="VisionEdgeI18n.setLanguage(this.value)"><option value="zh-Hant">繁體中文</option><option value="zh-Hans">简体中文</option><option value="en">English</option><option value="es">Español</option></select></label></header>
<nav class="primary-navigation" aria-label="主要導覽"><button class="primary-tab" onclick="leaveCamera('/edge')">即時檢測</button><button class="primary-tab" onclick="leaveCamera('/template-studio')">取像與樣板</button><button class="primary-tab" onclick="leaveCamera('/flow-studio')">規則／流程</button></nav>
<main><section><h2>即時預覽</h2><p>這些設定會影響所有產品的取像。請先確認畫面，再調整控制項。</p><img id="preview" hidden alt="相機即時預覽"><div class="actions"><button id="start" onclick="startPreview()">啟動／查看即時預覽</button><button id="refresh" onclick="refreshCamera()">讀取相機狀態</button></div><p id="cameraState" role="status">正在讀取設備…</p><p id="device"></p><p>相機變焦或視角改變後，請重新確認既有標記位置與樣板分數。</p></section>
<section><h2>BRIO 取像控制</h2><p>只顯示 Jetson 目前偵測到的 V4L2 控制。自動曝光、自動白平衡及自動對焦開啟時，對應的手動值可能暫時不生效。</p><label><span>控制模式</span> <select id="mode" onchange="renderEnabled()"><option value="off">保持相機現況</option><option value="manual">儲存並套用自訂值</option></select></label><div id="basic" class="fields" style="margin-top:20px"></div><details><summary>進階影像控制</summary><div id="advanced" class="fields" style="margin-top:16px"></div></details><p id="unsupported" class="unsupported"></p><div class="actions"><button class="primary" id="apply" onclick="applyCamera()">儲存並套用相機設定</button><button id="discard" onclick="discardCamera()">放棄修改</button></div><p>套用中會重啟取像；錄影或工件檢測進行中不能套用。套用後請重新驗證樣板。</p></section></main>
<script src="/static/visionedge_i18n.js?v=2.4.8"></script><script src="/static/latest_preview.js?v=2"></script><script src="/static/notice.js?v=2"></script><script src="/static/camera_settings.js?v=1"></script>
</body></html>
