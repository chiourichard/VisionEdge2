# Copy to config/edge.ini on a new Jetson deployment after backing up its
# existing configuration. Replace the BRIO by-id path if the serial differs.
[server]
host = 0.0.0.0
port = 8080
tls = off
threads = 8

[edge]
backend = opencv
capture_mode = gstreamer
source = /dev/v4l/by-id/usb-046d_Logitech_BRIO_F2D7B35E-video-index0
width = 3840
height = 2160
framerate = 30/1
rotation = 0
ldc = false

# Set the product ID after creating/importing a product and its templates.
product_id = 0
infer_fps = 5
method = TM_CCOEFF_NORMED
inference_device = cuda

# Full-resolution frames remain available for templates and snapshots. Only
# browser preview JPEGs are reduced in size.
preview_quality = 75
preview_max_width = 1280
snapshot_quality = 92

# Orin Nano has no NVENC; OpenCV performs software encoding at 1080p.
recording_width = 1920
recording_height = 1080
recording_fps = 15
record_source = raw
recording_bitrate = 0

min_free_mb = 10240
reconnect_sec = 2
loop_source = true
auto_start = true
