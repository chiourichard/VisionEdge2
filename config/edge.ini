# VisionEdge configuration
#
# [server] controls the device-side Web UI/API endpoint.
# [edge] controls the single-camera runtime.

[server]
host = 0.0.0.0
port = 8080

# Direct HTTPS, matching the SmartCam deployment model.
tls = on
certfile = config/certs/CRS0000000616.cert
keyfile = config/certs/CRS0000000616.key
threads = 12

[edge]
# auto: use Qualcomm QTI when qtiqmmfsrc is present; use OpenCV only on hosts
# where the QTI plugin is absent (for example Windows development). If QTI is
# present but camera acquisition fails, report the real QTI error instead of
# falling back to /dev/video0.
backend = auto
capture_mode = v4l2

# OpenCV fallback source. 0 = local camera index; may also be a video path/URI.
source = 0

# Qualcomm camera settings (qtiqmmfsrc).
camera = 0
width = 1920
height = 1080
framerate = 30/1
rotation = 180
ldc = false

# Existing LIVE_FLOW_GRAPH_REVIEW product ID. 0 = preview/capture only.
product_id = 0
infer_fps = 5.0
method = TM_CCOEFF_NORMED
inference_device = cpu

preview_quality = 80
preview_max_width = 0
snapshot_quality = 92

# QTI: hardware H.264 bitrate. OpenCV fallback uses its available encoder.
# 0 = automatic: 8 Mbps at 1080p, 16 Mbps at 4K.
recording_bitrate = 0
recording_fps = 30
record_source = raw
recording_width = 0
recording_height = 0

# Never delete data automatically. A recording is refused/stopped below this free space.
min_free_mb = 10240
reconnect_sec = 2
loop_source = true
auto_start = true
